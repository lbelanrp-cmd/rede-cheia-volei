name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - marca: rede
            arquivo: RedeCheiaVolei
            tag: v1
            titulo: Rede Cheia Vôlei
          - marca: liga
            arquivo: LigaDaJusticaVolei
            tag: liga-v1
            titulo: Liga da Justiça Vôlei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aplicar versão da marca
        if: matrix.marca != 'rede'
        run: python3 brand/${{ matrix.marca }}/apply.py

      - name: Instalar Capacitor
        run: |
          if ! npm install --no-audit --no-fund > npm.log 2>&1; then
            grep -iE "err|notarget|peer|404" npm.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::versoes $(npm view @capgo/capacitor-native-biometric versions --json | tr -d ' \n' | tail -c 400)"
            exit 1
          fi
          echo "::notice::biometria instalada $(node -p "require('@capgo/capacitor-native-biometric/package.json').version")"

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Recuperar tela ao voltar do segundo plano
        run: python3 native/fix_mainactivity.py

      - name: Ícone e tela de abertura
        run: cp -r resources/android/res/. android/app/src/main/res/

      - name: Liberar a câmera
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Montar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../${{ matrix.arquivo }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arquivo }}-apk
          path: ${{ matrix.arquivo }}.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}.${{ github.run_number }}
          name: ${{ matrix.titulo }} ${{ matrix.tag }}.${{ github.run_number }}
          files: ${{ matrix.arquivo }}.apk
          make_latest: ${{ matrix.marca == 'rede' }}

      - name: Link fixo da versão mais nova
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.marca }}-atual
          name: ${{ matrix.titulo }} (sempre a versão mais nova)
          body: Link fixo que sempre baixa a última versão do app.
          files: ${{ matrix.arquivo }}.apk
          make_latest: false
